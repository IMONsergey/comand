# Dedicated Comand virtual host. The hub stays on 127.0.0.1:4310.
server {
    listen 80;
    listen [::]:80;
    server_name comand.imon.world;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/comand-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comand.imon.world;
    ssl_certificate /etc/letsencrypt/live/comand.imon.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comand.imon.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
