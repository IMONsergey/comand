name: Verify Comand
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Show browser failure context
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for report in Path('test-results').rglob('error-context.md'):
              print(f'::group::{report}')
              print(report.read_text())
              print('::endgroup::')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
